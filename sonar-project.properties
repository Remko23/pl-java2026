# ╔═══════════════════════════════════════════════════════════════════╗
# ║  TruthLens — SonarQube Scanner Configuration                    ║
# ║  Multi-module project (no shared parent POM)                    ║
# ╚═══════════════════════════════════════════════════════════════════╝
#
# HOW TO USE:
#   1. Start SonarQube:   docker compose up sonarqube sonar-db -d
#   2. Wait ~60s for SonarQube to start, then open http://localhost:9000
#   3. Login:  admin / admin  (change password on first login)
#   4. Generate a project token:
#        → Projects → Create project manually → "truthlens"
#        → Generate token → copy it
#   5. Run analysis from project root:
#        mvn clean verify sonar:sonar -Dsonar.token=YOUR_TOKEN
#      OR using sonar-scanner CLI (if installed):
#        sonar-scanner -Dsonar.token=YOUR_TOKEN
#
# NOTE: This file is for the sonar-scanner CLI approach.
#       For Maven, use `mvn sonar:sonar` per-module (see run-sonar.ps1).

# ── Global Settings ───────────────────────────────────────────────
sonar.projectKey=truthlens
sonar.projectName=TruthLens
sonar.projectVersion=1.0-SNAPSHOT

sonar.host.url=http://localhost:9000

# ── Source Encoding ───────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Multi-Module Definitions ─────────────────────────────────────
sonar.modules=backend,gateway-service,search-service,ocr-service,discovery-server,config-server

# ── Backend (Orchestrator) ───────────────────────────────────────
backend.sonar.projectName=TruthLens Backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.java.source=25
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── Gateway Service ──────────────────────────────────────────────
gateway-service.sonar.projectName=TruthLens Gateway
gateway-service.sonar.sources=src/main/java
