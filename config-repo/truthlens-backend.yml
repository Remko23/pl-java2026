spring:
  data:
    redis:
      host: ${REDIS_HOST:truthlens-redis}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: mongodb://truthlens_app:truthlens_mongo_pass@${MONGO_HOST:truthlens-mongodb}:27017/truthlens_history?authSource=truthlens_history
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/truthlens}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://truthlens-keycloak:8080/realms/truthlens/protocol/openid-connect/certs}

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

groq:
  api-url: "https://api.groq.com/openai/v1"
  api-key: ${GROQ_API_KEY:default-test-key}
  models:
    - "openai/gpt-oss-20b"
    - "llama-3.3-70b-versatile"
    - "qwen/qwen3-32b"