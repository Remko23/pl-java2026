version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: truthlens-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://truthlens-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Start in dev mode for local testing
      KC_HOSTNAME_STRICT: "false"
    command: start-dev
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: truthlens-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - keycloak-data:/var/lib/postgresql/data

volumes:
  keycloak-data:
