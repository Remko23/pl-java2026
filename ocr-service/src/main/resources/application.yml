spring:
  application:
    name: truthlens-ocr-service
  config:
    import: "optional:configserver:http://truthlens-config-server:8888"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
        max-attempts: 15
