spring:
  application:
    name: truthlens-ocr-service
  config:
    import: "optional:configserver:http://truthlens-config-server:8888"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
        max-attempts: 15
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 0

gemini:
  api:
    key: ${GEMINI_API_KEY:}

eureka:
  client:
    serviceUrl:
      defaultZone: http://truthlens-discovery-server:8761/eureka/
